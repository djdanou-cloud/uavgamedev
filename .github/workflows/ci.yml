name: ci

# Gate 1 (docs/production/03-architecture.md §D5.2). Delivered in stages: this file holds the
# jobs whose tools exist today. CAD-FP-003 adds the gdUnit4 step, CAD-FP-004 the typecheck and
# sim-purity steps, CAD-FP-023 content validation, CAD-FP-041 the bench regression, CAD-FP-065
# the Android debug APK job. Every addition edits this file in its own card.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  lint:
    name: lint and python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: gdlint
        run: |
          set -euo pipefail
          files="$(find src scenes tools test -name '*.gd' | sort)"
          if [ -z "$files" ]; then
            echo "no .gd files yet - nothing to lint (expected until CAD-FP-004)"
            exit 0
          fi
          echo "$files" | xargs gdlint

      - name: gdformat --check
        run: |
          set -euo pipefail
          files="$(find src scenes tools test -name '*.gd' | sort)"
          if [ -z "$files" ]; then
            echo "no .gd files yet - nothing to format-check"
            exit 0
          fi
          echo "$files" | xargs gdformat --check

      - name: Python tool tests
        run: python tools/tests/test_scaffold.py

  engine:
    name: godot import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download and verify Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$HOME/.godot-bin"
          cd "$HOME/.godot-bin"
          curl -fsSL -O "$base/$zip"
          curl -fsSL -O "$base/SHA512-SUMS.txt"
          # Official releases publish SHA512-SUMS.txt only (verified 2026-09-08); pin by version and
          # verify the one line we care about, so a malformed sums file fails loudly instead of passing.
          grep -E "  ?${zip}\$" SHA512-SUMS.txt > expected.sha512 || {
            echo "::error::no checksum line for ${zip} in SHA512-SUMS.txt"; exit 1; }
          sha512sum -c expected.sha512
          echo "verified digest:"; cat expected.sha512
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Godot version
        run: |
          set -euo pipefail
          echo "GODOT_BIN=$HOME/.godot-bin/godot" >> "$GITHUB_ENV"
          "$HOME/.godot-bin/godot" --version

      - name: Import project (must be clean)
        run: |
          set -euo pipefail
          set -o pipefail
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log
          if grep -nE "ERROR|WARNING|SCRIPT ERROR" import.log; then
            echo "::error::godot --import produced errors or warnings (see lines above)"
            exit 1
          fi
          echo "import clean"

      - name: Typing gate must reject bad scripts
        # Inverted test for A-10. Godot keeps unknown project settings silently, so a renamed or
        # mistyped debug/gdscript/warnings/* key would switch the strict-typing gate off with no
        # error anywhere. Verified on 4.7.2 (2026-09-08): each probe exits 1 with
        # 'Parse Error: ... (Warning treated as error.)'. If a probe ever loads cleanly, this fails.
        run: |
          set -uo pipefail
          fail=0
          probe() {
            name="$1"; body="$2"; needle="$3"
            printf '%b' "$body" > "src/cad_probe_${name}.gd"
            "$GODOT_BIN" --headless --path . --check-only -s "res://src/cad_probe_${name}.gd" > "probe_${name}.log" 2>&1
            code=$?
            rm -f "src/cad_probe_${name}.gd"
            if [ "$code" -eq 0 ] || ! grep -q "$needle" "probe_${name}.log"; then
              echo "::error::typing gate inactive for ${name} (exit ${code})"
              cat "probe_${name}.log"
              fail=1
            else
              echo "ok: ${name} rejected (exit ${code})"
            fi
          }
          probe untyped 'extends RefCounted\n\nvar probe_untyped = 1\n' "has no static type"
          probe discard 'extends RefCounted\n\n\nfunc _make() -> int:\n\treturn 1\n\n\nfunc run() -> void:\n\t_make()\n' "will be discarded"
          probe unsafe 'extends RefCounted\n\n\nfunc run(o: Variant) -> void:\n\to.no_such_method()\n' "is not present on the inferred type"
          exit $fail

      - name: gdUnit4 suite
        # Exit codes are gdUnit4's own: 0 pass, 100 failures, 101 warnings (verified locally 2026-09-08).
        # --ignoreHeadlessMode is mandatory: headless is refused without it.
        run: |
          set -uo pipefail
          "$GODOT_BIN" --headless --path . -d -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a res://test -rd reports/gdunit -c
          code=$?
          echo "gdunit4 exit ${code} (0 pass / 100 failures / 101 warnings)"
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logs
          path: |
            import.log
            probe_*.log
            reports/
          if-no-files-found: ignore
